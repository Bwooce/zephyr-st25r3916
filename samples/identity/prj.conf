# zephyr-st25r3916 identity sample.

CONFIG_GPIO=y
CONFIG_SPI=y

CONFIG_ST25R3916=y
# The ElecHouse Mini module carries a ST25R3916B; flip to
# CONFIG_ST25R3916_VARIANT_BASE for a non-B chip.
CONFIG_ST25R3916_VARIANT_B=y

CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y

# RTT console: on the nRF54L15 DK the VCOM UART produced zero bytes in bench
# testing while RTT worked first try (see the OffGridGate firmware notes);
# RTT also needs no extra cable beyond the debug probe. Read it with e.g.:
#   probe-rs attach --chip nRF54L15 build/zephyr/zephyr.elf
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_UART_CONSOLE=n
CONFIG_LOG_BACKEND_RTT=y
